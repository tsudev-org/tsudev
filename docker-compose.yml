services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Cổng HOST là 5433 để trùng DATABASE_URL trong .env - trước đây map 5432
      # nên `npm run db:migrate` chạy từ host lại migrate cluster user-space chứ
      # không phải Postgres của compose, và không có gì báo. Cổng trong container
      # vẫn 5432 (mặc định của image), service khác nối qua `postgres:5432`.
      # Hệ quả có chủ ý: chạy đồng thời cluster user-space và compose sẽ đụng cổng
      # và compose báo lỗi ngay - thà vậy còn hơn âm thầm tách làm hai database.
      - '5433:5432'

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  # content và storage dựng từ CÙNG image backend mà Render dựng
  # (docker/backend-service.Dockerfile - job `backend-image` của CI chứng minh nó
  # khởi động được). Trước 05/11/2026 mỗi service có Dockerfile + package-lock.json
  # riêng từ commit đầu tiên: Dockerfile chạy `node src/index.js` (mã nay là .ts
  # biên dịch ra dist/) và `npm install` cô lập trong thư mục service (404 vì
  # @tsudev/* không có trên registry), còn hai lock cũ đó sinh 18 cảnh báo
  # Dependabot runtime cho một cây phụ thuộc không ai cài. Đã xoá cả hai.
  content-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
    command: ['node', 'services/content-service/dist/index.js']
    ports:
      - '4001:4001'
    depends_on:
      - postgres
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

  frontend-main:
    build:
      context: .
      dockerfile: apps/frontend-main/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - content-service
    environment:
      - NEXTAUTH_URL=http://frontend-main:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Khoá ký khẳng định danh tính BFF → service. PHẢI giống giá trị của
      # backend, nếu không mọi đường ghi đã xác thực trả 401.
      - INTERNAL_IDENTITY_SECRET=${INTERNAL_IDENTITY_SECRET}

  storage-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
    command: ['node', 'services/storage-service/dist/index.js']
    ports:
      - '4002:4002'
    depends_on:
      - minio
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://minio:9000
      - S3_BUCKET=tsudev
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - PORT=4002
    # Không mount src/: image chạy bản đã biên dịch ở dist/, mount mã .ts vào
    # không đổi được gì. Lặp nhanh thì dùng `npm run dev:local` ngoài docker.

  e2e-runner:
    build:
      context: .
      dockerfile: docker/e2e-runner.Dockerfile
    working_dir: /work
    volumes:
      - ./:/work:cached
    environment:
      - E2E_FRONTEND=http://frontend-main:3000
      - E2E_STORAGE=http://storage-service:4002
      - E2E_UPLOAD_PATH=/work/scripts/upload-file.txt
      - E2E_IN_DOCKER=1
      # Use server-side presign+PUT fallback by default for reliable E2E runs.
      - E2E_FORCE_FALLBACK=1
    depends_on:
      - frontend-main
      - storage-service
    command:
      [
        'bash',
        '-lc',
        "for i in $(seq 1 120); do if ( (echo > /dev/tcp/frontend-main/3000) >/dev/null 2>&1 ) && ( (echo > /dev/tcp/storage-service/4002) >/dev/null 2>&1 ); then echo 'all services up'; break; fi; echo 'waiting for services...'; sleep 1; done; npx playwright test --config=e2e/playwright.config.js --project=full-stack",
      ]

volumes:
  postgres_data:
  minio_data:
