name: CodeQL

# Chuyển từ "default setup" sang workflow riêng (13/11/2026). Default setup giữ danh sách
# ngôn ngữ CỐ ĐỊNH lúc bật (gồm `python`); repo không còn tệp .py nào từ 13/11/2026 nên
# `Analyze (python)` đỏ ở MỌI PR ("could not process any code written in Python"). API của
# default setup lại KHÔNG cho đặt `rust` (preview) - bỏ python ở đó là mất luôn phân tích
# Rust của packages/trust-crypto (mã ký Ed25519 bản phát hành). Workflow riêng giữ được cả hai.
#
# ⚠️ Repo có workflow CodeQL riêng thì default setup phải TẮT (GitHub tắt workflow + từ chối
# SARIF nếu cả hai cùng bật) - đã tắt cùng lúc merge tệp này.
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '41 3 * * 2' # hằng tuần, như default setup trước đây
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Thêm ngôn ngữ ở đây khi repo có mã của ngôn ngữ đó - đừng để ngôn ngữ không có mã.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
