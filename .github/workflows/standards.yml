name: Cổng kiểm quy ước

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Kiểm quy ước
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Các script kiểm chỉ đọc cây git và tải bộ quy ước từ repo PUBLIC bằng
          # curl - không cần token git nào nằm lại trong .git/config.
          persist-credentials: false

      - name: Cổng kiểm quy ước cục bộ
        run: ./scripts/check-standards.sh

      - name: Đối chiếu với bộ quy ước trung tâm
        run: ./scripts/sync-standards.sh --check

      # BRAND_ASSETS.md mục 12.2 buộc repo con tự chặn khi thiếu tài sản nhận diện.
      # Kiểm cả SỰ TỒN TẠI lẫn HÌNH DẠNG: thiếu file thì trang vẫn chạy và không gì
      # đỏ lên - tab trình duyệt chỉ lặng lẽ trống, đúng loại hỏng im lặng mà bộ quy
      # ước gọi là "điều kiện phát hành".
      - name: Kiểm tài sản nhận diện
        run: ./scripts/check-brand-assets.js
