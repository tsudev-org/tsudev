name: CI

# ⚠️ `push` CỐ Ý chỉ nghe `main`. Thêm 'feat/**' vào đây là mỗi lần đẩy một nhánh
# đang có PR sẽ sinh HAI lần chạy y hệt nhau, cách nhau vài giây - một cho `push`,
# một cho `pull_request`. Đó chính là hình cũ của tệp này, và nó đã đốt khoảng 20
# lượt chạy thừa chỉ trong tháng 8/2026 (~360 phút, ~18% hạn mức tháng).
#
# Vì sao đây là chuyện lớn ở repo này: repo private được 2.000 phút Actions/tháng,
# hết phút thì job BỊ CHẶN chứ không sinh hoá đơn - tức là triệu chứng sẽ là "CI
# không chạy nữa" ngay giữa một đợt phát hành, không phải một dòng tiền.
#
# Nhánh chưa mở PR vì thế không có CI. Đó là đánh đổi có chủ đích: `.husky/pre-push`
# đã chạy bốn cổng gốc ở máy trước khi đẩy, và mở PR là lúc cần bằng chứng cho
# người khác đọc.
on:
  push:
    branches: [main]
  pull_request: {}

# Đẩy tiếp lên cùng một nhánh thì huỷ lượt đang chạy dở - kết quả của nó không ai
# đọc nữa. KHÔNG áp cho `main`: ở đó mỗi commit là một trạng thái đã phát hành,
# huỷ lượt kiểm của nó là mất bằng chứng.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Không cấp gì ở cấp workflow; từng job tự khai đúng thứ nó cần. Mọi job ở đây
# chỉ ĐỌC mã nguồn - không job nào ghi vào repo, PR hay code scanning.
permissions: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Hợp đồng mạng (cổng/tên miền)
        run: npm run topology:check
      # Cổng token giao diện. `packages/ui/src/tokens.css` là bản SINH RA từ
      # `.standards/tokens/design-tokens.json` ghép `tokens/extensions.tsudev-web.json`;
      # sửa tay nó thì thay đổi sống ở local mà biến mất ở lần chạy `tokens:sync`
      # kế tiếp - im lặng, không ai báo lỗi. Bước này cũng bắt luôn trường hợp hai
      # artifact của gói đồng bộ (`.standards/tokens/tokens.css` và file JSON cùng
      # thư mục) trôi lệch khỏi nhau.
      - name: Token giao diện khớp nguồn chân lý
        run: npm run tokens:check
      # Cổng font. `apps/frontend-main/styles/fonts.css` + `public/fonts/*.woff2`
      # là bản SINH RA bởi `fonts:sync`. Bước này bắt ba chuyện, cả ba đều im lặng
      # trên production: (a) artifact lệch bảng `HO_FONT` của script, (b) thiếu
      # tệp woff2 mà CSS trỏ tới - trình duyệt ăn 404 và không nói một lời,
      # (c) ai đó quay lại dùng `@import` từ fonts.googleapis.com, thứ mà CSP của
      # production chặn và đã chặn im lặng suốt nhiều tháng.
      #
      # CẦN MẠNG: bước này gọi fonts.googleapis.com để đối chiếu. Nếu CI mất mạng
      # ra ngoài thì nó đỏ - đó là đánh đổi có chủ đích, vì cách duy nhất để khỏi
      # cần mạng là tin vào artifact đã commit, tức bỏ luôn thứ ta đang canh.
      - name: Font tự host khớp nguồn
        run: npm run fonts:check
      - run: npm run format:check
      - run: npm run lint --silent
      # Cổng kiểm kiểu. Trước đây repo có typescript trong devDependencies
      # và 3 file .ts/.tsx chạy thật, nhưng KHÔNG có tsconfig nào và không
      # có bước tsc - esbuild chỉ xoá kiểu chứ không kiểm. Bước này đóng lỗ đó.
      # Kiểm kiểu đọc kiểu Prisma qua packages/db/src/index.d.ts, mà client của
      # Prisma là mã SINH RA - chưa generate thì tsc không tìm thấy @prisma/client.
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Kiểm kiểu (TypeScript)
        run: npm run typecheck

  wasm:
    name: WASM con dấu - artifact phải khớp mã nguồn
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/trust-crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml ghim phiên bản và target; `rustup show` cài đúng bộ đó.
      - name: Toolchain Rust (ghim trong rust-toolchain.toml)
        run: rustup show
      - name: Test Rust
        run: cargo test --release
      # Dựng bằng ĐÚNG script mà máy dev dùng, không phải `cargo build` trần.
      # Script đó gắn --remap-path-prefix; thiếu nó, thông điệp panic của các
      # crate phụ thuộc nhúng đường dẫn TUYỆT ĐỐI của máy dựng
      # (/home/<user>/.cargo/registry/...), nên bản dựng ở local và trên runner
      # KHÔNG BAO GIỜ khớp byte. Hai bên dựng bằng hai lệnh khác nhau là cách
      # chắc chắn nhất để cổng kiểm tra này báo đỏ vì lý do sai.
      - name: Dựng lại .wasm bằng đúng script của repo
        working-directory: .
        run: npm --workspace packages/trust-crypto run build:wasm
      # Artifact .wasm được COMMIT vào repo vì image Docker dựng từ git và không
      # có Rust. Bước này là thứ duy nhất chứng minh artifact đó khớp mã nguồn -
      # thiếu nó thì mã Rust và thứ đang ký chứng chỉ có thể trôi xa nhau mà
      # không ai biết. build:wasm đã chép vào pkg/, nên cây git bẩn = lệch.
      - name: Artifact đã commit phải khớp bản vừa dựng
        working-directory: .
        run: |
          git diff --exit-code -- packages/trust-crypto/pkg/trust_crypto.wasm \
            || { echo "::error::pkg/trust_crypto.wasm không khớp mã nguồn Rust - chạy 'npm --workspace packages/trust-crypto run build:wasm' rồi commit lại"; exit 1; }

  test:
    name: Migrate & test services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsudev
          POSTGRES_PASSWORD: tsudev
          POSTGRES_DB: tsudev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tsudev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://tsudev:tsudev@localhost:5432/tsudev?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate + migrate (deploy)
        run: |
          npm run db:generate
          npm run db:migrate
      - name: Run service unit tests
        run: |
          npm --workspace services/content-service test
          npm --workspace services/storage-service test
          npm --workspace services/auth-service test
          # Chế độ gộp là hình trạng CHẠY THẬT trên production. Bỏ dòng này thì
          # bất biến "mỗi tiền tố tới đúng app sở hữu" (gồm JWKS ký bản phát hành,
          # bắt buộc công khai) mất người canh - triệu chứng là 401/404 ở
          # production chứ không phải CI đỏ.
          npm --workspace services/backend-bundle test
          # renderMarkdown là ranh giới XSS (đầu ra đi thẳng vào
          # dangerouslySetInnerHTML ở ba trang). Test của nó phải chạy trong CI,
          # không phải chỉ tồn tại trong repo.
          npm --workspace apps/frontend-main test
          # Cổng tương phản của hệ token màu - đọc thẳng packages/ui/src/tokens.css.
          npm --workspace packages/ui test

  # Dựng CHÍNH image mà Render dựng (docker/backend-service.Dockerfile) rồi khởi
  # động nó đúng như dockerCommand trong render.yaml, NODE_ENV=production, với
  # Postgres thật - và đòi /health trả 200.
  #
  # Vì sao cần: mọi job khác chạy mã trên Node của runner, KHÔNG trong image. Đổi
  # base image (Node, Debian, OpenSSL cho engine Prisma) hay quên COPY một tệp thì
  # cả CI xanh mà production không boot - và Render tự deploy khi merge vào main.
  # Đây là lớp duy nhất thấy được những lỗi chỉ tồn tại trong image.
  backend-image:
    name: Image backend - dựng + khởi động như Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsudev
          POSTGRES_PASSWORD: tsudev
          POSTGRES_DB: tsudev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tsudev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dựng image
        run: docker build -f docker/backend-service.Dockerfile -t tsudev-backend:ci .
      # Bí mật ở đây đều SINH MỚI mỗi lượt, chỉ sống trong job này. Khoá ký bản
      # phát hành phải là Ed25519 thật: thiếu nó thì production CỐ Ý từ chối khởi
      # động (releaseSigning.ts), và đó đúng là điều job này cần chứng minh là
      # không xảy ra khi cấu hình đủ.
      - name: Migrate rồi khởi động, chờ /health
        env:
          DATABASE_URL: postgresql://tsudev:tsudev@localhost:5432/tsudev?schema=public
        run: |
          set -euo pipefail
          RELEASE_SIGNING_KEY="$(openssl genpkey -algorithm ed25519 | base64 -w0)"
          INTERNAL_IDENTITY_SECRET="$(openssl rand -hex 32)"
          TOTP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export RELEASE_SIGNING_KEY INTERNAL_IDENTITY_SECRET TOTP_ENCRYPTION_KEY
          run() {
            docker run --network host \
              -e NODE_ENV=production -e PORT=4000 -e DATABASE_URL \
              -e RELEASE_SIGNING_KEY -e RELEASE_SIGNING_KEY_ID=ci \
              -e INTERNAL_IDENTITY_SECRET -e TOTP_ENCRYPTION_KEY \
              "$@"
          }
          # migrationGate thoát 1 khi DB thiếu migration - áp trước, bằng chính
          # prisma CLI trong image.
          run --rm tsudev-backend:ci npm exec --workspace packages/db -- prisma migrate deploy
          # KHÔNG `--rm` ở đây: tiến trình chết thì container phải còn lại để
          # `docker logs` đọc được lý do (bản đầu có --rm và mất sạch log).
          run -d --name backend tsudev-backend:ci node services/backend-bundle/dist/index.js
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health || true)"
            echo "lượt $i: /health -> $code"
            if [ "$code" = 200 ]; then
              curl -s http://127.0.0.1:4000/health; echo
              docker rm -f backend >/dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' backend)" != true ]; then
              echo "::error::tiến trình backend đã CHẾT trước khi /health trả 200"
              break
            fi
            sleep 2
          done
          echo '--- log backend ---'
          docker logs backend || true
          docker rm -f backend >/dev/null 2>&1 || true
          exit 1

  e2e-app:
    name: E2E - smoke các trang được giữ
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsudev
          POSTGRES_PASSWORD: tsudev
          POSTGRES_DB: tsudev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tsudev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 5432 là cổng service container của GitHub Actions, khai ở
      # config/topology.json → overrides.ci kèm lý do.
      DATABASE_URL: postgresql://tsudev:tsudev@localhost:5432/tsudev?schema=public
      NEXTAUTH_SECRET: e2e-placeholder-secret
      # KHÔNG phải bí mật - giá trị cố định chỉ cho CI, giống NEXTAUTH_SECRET ở
      # trên. Cần ở HAI chỗ và phải là CÙNG một giá trị: db:seed:dev dùng nó mã
      # hoá bí mật TOTP của tài khoản dev ADMIN/OWNER (thiếu hoặc < 32 ký tự là
      # seed thoát 1), và auth-service do Playwright dựng (webServer chuyền
      # ...process.env xuống) dùng nó giải mã khi kiểm mã 2FA. CI không có .env,
      # và dotenv không ghi đè biến đã có, nên env của job là nguồn duy nhất.
      TOTP_ENCRYPTION_KEY: ci-only-totp-key-khong-phai-bi-mat-chi-dung-cho-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Cache trình duyệt của Playwright. Không cache thì mỗi lượt chạy tải lại
      # Chromium (~140MB) qua mạng, và ĐÓ LÀ CHỖ CI ĐÃ TREO BA LẦN - xem
      # timeout-minutes ngay dưới.
      - name: Cache trình duyệt Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      # Chỉ chromium: bộ `app` không cần engine khác, tải đủ ba là thêm vài phút
      # mỗi lần chạy CI mà không đổi kết quả.
      #
      # ⚠️ KHÔNG `--with-deps`. Đó là thứ đã treo CI bốn lần liền, và trần 10 phút
      # ở dưới chính là cái làm nó lộ ra: lần đầu có log để đọc, log nói rõ
      #
      #     Get:3 fonts-freefont-ttf   5641 kB   12:06:07
      #     Get:4 fonts-tlwg-loma-otf   107 kB   12:12:03   ← 6 phút cho 107 KB
      #
      # `--with-deps` chạy `apt-get install` kéo về phông CJK/Thái (ipafont,
      # unifont, wqy-zenhei, xfonts-*) để Chromium dựng được chữ không phải Latin
      # khi CHỤP ẢNH. Bộ smoke ở đây khẳng định trên DOM chứ không so pixel, nên
      # 21 MB phông đó không đổi kết quả một phép kiểm nào - nó chỉ mua thêm một
      # phụ thuộc vào mirror Ubuntu, thứ chậm bất thường ở các lần vừa rồi.
      #
      # Không có `--with-deps` thì bước này chỉ tải nhị phân Chromium từ CDN của
      # Playwright, và bản tải đó nằm trong cache ở trên nên lần sau không tải
      # lại. Thư viện hệ thống mà Chromium cần đã có sẵn trong ảnh ubuntu-latest.
      #
      # Trần 10 phút giữ nguyên làm lưới an toàn: thà đỏ nhanh rồi chạy lại còn
      # hơn treo im lặng tới trần mặc định 360 phút của GitHub - tức 18% hạn mức
      # tháng cho MỘT job không sinh kết quả nào.
      - run: npx playwright install chromium
        timeout-minutes: 10
      # Smoke khẳng định NỘI DUNG THẬT (tiêu đề bài lấy từ DB), nên phải có DB đã
      # migrate + seed. Không có nó thì getServerSideProps nuốt lỗi, trang rỗng
      # vẫn trả 200 và test xanh mà chẳng chứng minh được gì.
      - name: Prisma generate + migrate + seed
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          # db:seed:dev require dist/ của auth-service (băm Argon2id), nên phải
          # dựng trước; db:generate đứng trước vì Prisma client là phụ thuộc kiểu.
          npm run build:services
          # Mật khẩu cho ba tài khoản dev. Bộ E2E đăng nhập bằng đúng luồng của
          # người dùng thật (Argon2id trong DB) - không còn provider `e2e-dev`
          # nhận mọi username với `devpass`.
          npm run db:seed:dev
      # Playwright tự dựng các service, frontend-main và
      # dev-proxy (webServer trong e2e/playwright.config.js).
      - run: npm run e2e:app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    name: Build frontends
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build TypeScript workspaces
        run: npm run build:ts
      # ⚠️ Cổng này CỐ Ý chạy bước gói cho Cloudflare, không chỉ `next build`.
      #
      # Production chạy Workers qua `@opennextjs/cloudflare`, và bước GÓI mới là
      # nơi hỏng: 27/08/2026 (B1, next@16) có HAI lỗi chặn deploy mà `next build`
      # xanh trơn tru - một lockfile hoá thạch làm lệch gốc workspace, và
      # `jose`/`@panva/hkdf` chỉ được chép nhánh `node` trong khi esbuild gói dưới
      # điều kiện `workerd`. CI cũ không chạy bước này nên cả hai vô hình: cây
      # xanh 7/7 trong khi bản deploy được KHÔNG dựng nổi.
      #
      # `opennextjs-cloudflare build` tự gọi `npm run build` (tức `next build`)
      # rồi mới gói, nên một bước này phủ CẢ HAI - không cần chạy next build riêng.
      # `build` KHÔNG cần credential Cloudflare; chỉ `deploy`/`preview` mới cần.
      - name: Dựng frontend + GÓI cho Cloudflare Workers
        run: |
          npm --workspace apps/frontend-main exec -- opennextjs-cloudflare build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
