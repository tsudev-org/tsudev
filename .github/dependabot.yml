# Dependabot - G1 của docs/security-plan.md.
#
# npm: MỘT mục ở thư mục gốc là đủ - repo là npm workspaces với một
# package-lock.json duy nhất, Dependabot đọc nó cho mọi workspace.
#
# Nhóm để giảm PR rác: phụ thuộc dev gộp một PR/tuần, bản vá+minor của production
# gộp một PR/tuần. Major của production vẫn đi PR riêng - đó là chỗ cần người đọc.
# Major của DEV cũng tách khỏi nhóm (`update-types: [minor, patch]`): #131 gộp
# 28 gói kể cả major nên CI đỏ mà không chỉ ra được gói nào - một nhóm chỉ có
# ích khi cả nhóm cùng xanh.
#
# @prisma/* major bị bỏ qua có chủ đích: 5→7 đổi cách sinh client và cấu hình
# datasource, cần một phiên riêng có kế hoạch (#133). Gỡ `ignore` khi lên kế
# hoạch nâng. Bản vá bảo mật của Prisma KHÔNG bị chặn - `ignore` không áp cho
# security updates.
#
# jose major bị bỏ qua có chủ đích (#135 đóng 05/11/2026): v6 chỉ còn ESM, mà
# @tsudev/identity-token biên dịch ra CommonJS ⇒ webpack của Next và Jest đều
# từ chối `require('jose')`. Quan trọng hơn: next-auth@4 tự phụ thuộc jose@^4,
# nên nâng identity-token chỉ THÊM một bản jose thứ hai chứ không gỡ được v4
# khỏi cây. Gỡ `ignore` này cùng lúc chuyển next-auth 4 → Auth.js 5.
#
# Cảnh báo bảo mật (security updates) KHÔNG bị nhóm này giữ lại: Dependabot mở
# chúng ngay khi có advisory, độc lập với nhịp tuần.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jose'
        update-types: ['version-update:semver-major']
      # Storybook + Vite major bị bỏ qua có chủ đích (#169, #170 đóng 06/11/2026).
      # Dependabot nâng TỪNG gói: #169 đưa `storybook` lên 10 trong khi
      # `@storybook/react-vite` ở lại 8 (peer `storybook ^8.6.18`), #170 đưa vite
      # lên 8 trong khi builder của Storybook 8 chỉ nhận vite <=6. Cả hai CI XANH
      # vì Storybook không nằm trong CI. Lên 10 là một cuộc di trú: addon-essentials
      # không có bản sau 8 (đã gộp vào lõi), cấu hình `.storybook/main.js` phải
      # thành ESM. Gỡ ba dòng này khi lên kế hoạch nâng, và nghiệm thu bằng cách
      # ĐẾM story vẽ ra được (docs/design-system.md §Storybook).
      - dependency-name: 'storybook'
        update-types: ['version-update:semver-major']
      - dependency-name: '@storybook/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      # Công cụ dựng/lint - major bị bỏ qua có chủ đích (#174-#177 đóng 06/11/2026).
      # Mỗi cái là một cuộc di trú, không phải một PR tự động:
      # - typescript 7 là bản viết lại (tsgo): #176 đỏ 5 check (build, test, image).
      # - eslint 10: #177 đỏ 5 check. Flat config xong (ESLint 9, `eslint.config.mjs`);
      #   còn chờ eslint-plugin-react và jsx-a11y nhận peer eslint 10.
      # - eslint-plugin-react-hooks 7 thêm luật React Compiler: #174 đỏ lint.
      # - @types/node phải BÁM RUNTIME (Node 22), không bám bản mới nhất: #175 đưa
      #   lên 26, nên kiểu của API chưa có ở Node 22 vẫn biên dịch được mà chạy thì vỡ.
      #   Nâng tay khi đổi runtime.
      # - tailwindcss 4 tách plugin PostCSS sang `@tailwindcss/postcss` và chuyển
      #   cấu hình sang CSS (`@theme`): #181 đỏ build + E2E. Bảng ánh xạ token ↔
      #   class (`docs/design-system.md`) phải dựng lại, nghiệm thu bằng mắt ở
      #   CẢ BA chế độ giao diện.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # `@eslint/js` đi cùng nhịp major với `eslint` (10.x peer `eslint ^10`): #187.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ['*']
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, github_actions]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns: ['*']

  # Ảnh nền Docker ghim theo DIGEST (Scorecard PinnedDependencies, 06/11/2026).
  # Ghim mà không có mục này thì ảnh nền đứng yên mãi ở bản vá OS của ngày ghim -
  # an toàn chuỗi cung ứng đổi lấy lỗ hổng cũ. Dependabot mở PR đổi digest khi
  # tag (`22-bookworm-slim`, `focal`) được dựng lại.
  - package-ecosystem: docker
    directories: [/docker, /apps/frontend-main]
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, docker]
    commit-message:
      prefix: 'chore(docker)'
    # CHỈ nhận digest/minor của dòng đang chạy - #164 (đóng 06/11/2026) đổi
    # `22-bookworm-slim` thành `25-bookworm-slim`: Node 25 là bản lẻ, không LTS,
    # hết hỗ trợ sau vài tháng, và production (Render) chạy Node 22. Lên LTS kế
    # tiếp là việc có kế hoạch: `engines` + `node-version` của CI cùng lúc với ảnh nền.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
